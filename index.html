<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0B0C" />
    <meta
      name="description"
      content="Canvas Emporium — premium Indian-made canvas tents, expedition gear, travel bags and outdoor living. A catalogue of engineered shelter and considered equipment."
    />
    <title>Canvas Emporium — Engineered Shelter &amp; Expedition Goods</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@200;300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Resolve theme before first paint so there is never a flash of the wrong palette.
      (function () {
        try {
          var stored = localStorage.getItem('ce-theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          /* keep the dark default from the class attribute */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
